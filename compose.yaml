x-runtime: &runtime
  image: commfair:local
  working_dir: /app
  volumes:
    - ./outputs:/app/outputs
    - ./outputs/forecast/f0:/app/forecast/comfair/artifacts/forecasting
    - ./forecast/reader:/app/forecast/reader:ro
    - ./forecast/inputs:/app/forecast/inputs:ro
    - ./coalitions/reader:/app/coalitions/reader:ro
    - ./coalitions/inputs:/app/coalitions/inputs:ro

x-forecast-data: &forecast-data
  COMFAIR_LOAD_CSV: /app/examples/data/comergy/com_energy_consumption.csv
  COMFAIR_PV_CSV: /app/examples/data/comergy/com_energy_production.csv

services:
  app:
    <<: *runtime
    build:
      context: .

  verify:
    <<: *runtime
    command: ["python", "coalitions/scripts/verify_release.py"]

  coalition-tests:
    <<: *runtime
    command: ["python", "-m", "unittest", "discover", "-s", "coalitions/tests", "-v"]

  coalition-query:
    <<: *runtime
    command: ["python", "coalitions/scripts/query_coalition.py", "--members", "1,3,8", "--model", "cooperative_pool"]

  figures:
    <<: *runtime
    command:
      - python
      - coalitions/scripts/generate_coalition_fragmentation_figure.py
      - --output-dir
      - outputs/coalitions/figures

  solver-smoke:
    <<: *runtime
    command: ["python", "coalitions/scripts/smoke_physical.py"]

  example-coalition:
    <<: *runtime
    command:
      - python
      - examples/run_coalition_csv.py
      - --members
      - 1,3,8
      - --start
      - "7008"
      - --hours
      - "24"
      - --output
      - /app/outputs/examples/coalition-1-3-8.json

  example-csv-tests:
    <<: *runtime
    command: ["python", "-m", "unittest", "discover", "-s", "examples/tests", "-v"]

  forecast-demo-champion:
    <<: *runtime
    environment: *forecast-data
    working_dir: /app/forecast
    command:
      - python
      - -m
      - scripts.demo
      - --origin-t
      - "7008"
      - --model
      - champion
      - --output-dir
      - /app/outputs/forecast/demo-champion

  forecast-demo-naive24:
    <<: *runtime
    environment: *forecast-data
    working_dir: /app/forecast
    command:
      - python
      - -m
      - scripts.demo
      - --origin-t
      - "7008"
      - --model
      - naive_24
      - --output-dir
      - /app/outputs/forecast/demo-naive-24

  example-forecast-champion:
    <<: *runtime
    working_dir: /app/forecast
    command:
      - python
      - -m
      - scripts.demo
      - --load-csv
      - /app/examples/data/comergy/com_energy_consumption.csv
      - --pv-csv
      - /app/examples/data/comergy/com_energy_production.csv
      - --origin-t
      - "7008"
      - --model
      - champion
      - --output-dir
      - /app/outputs/examples/forecast-champion

  example-forecast-naive24:
    <<: *runtime
    working_dir: /app/forecast
    command:
      - python
      - -m
      - scripts.demo
      - --load-csv
      - /app/examples/data/comergy/com_energy_consumption.csv
      - --pv-csv
      - /app/examples/data/comergy/com_energy_production.csv
      - --origin-t
      - "7008"
      - --model
      - naive_24
      - --output-dir
      - /app/outputs/examples/forecast-naive-24

  forecast-custom:
    <<: *runtime
    environment: *forecast-data
    working_dir: /app/forecast
    command:
      - python
      - -m
      - scripts.train_custom
      - --output-dir
      - /app/outputs/forecast/custom

  forecast-f0:
    <<: *runtime
    environment: *forecast-data
    working_dir: /app/forecast
    command:
      - python
      - -m
      - comfair.forecasting.benchmark
      - --output-dir
      - /app/forecast/comfair/artifacts/forecasting

  forecast-f1:
    <<: *runtime
    environment: *forecast-data
    working_dir: /app/forecast
    command:
      - python
      - -m
      - comfair.forecasting.model_benchmark
      - --output-dir
      - /app/outputs/forecast/f1

  forecast-tests:
    <<: *runtime
    environment: *forecast-data
    working_dir: /app/forecast
    command: ["python", "-m", "pytest", "tests", "-q"]
